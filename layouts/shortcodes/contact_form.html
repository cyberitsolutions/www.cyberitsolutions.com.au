<form class="contact_form" method="post" action="https://forms.un-static.com/forms/{{ .Site.Params.un_static_endpoint_reference | safeHTML }}">
  <div class="form-group row">
    <label for="name" class="col-form-label">Name</label>
    <div class="input-group">
      <div class="input-group-prepend"><i class="input-group-text fa fa-user"></i></div>
      <input type="text" class="form-control" id="inputName" placeholder="Please enter your name" name="name" required>
    </div>
  </div>
  <div class="form-group row">
    <label for="email" class="col-form-label">Email</label>
    <div class="input-group">
      <div class="input-group-prepend"><i class="input-group-text fa fa-envelope"></i></div>
      <input type="email" class="form-control" id="inputEmail" placeholder="Email" name="email" required>
    </div>
  </div>
  <div class="form-group row">
    <label for="phone" class="col-form-label">Phone</label>
    <div class="input-group">
      <div class="input-group-prepend"><i class="input-group-text fa fa-phone"></i></div>
      <input type="tel" class="form-control" id="inputPhone" placeholder="Phone" name="phone" required>
    </div>
  </div>
  <div class="form-group row">
    <label for="message" class="col-form-label">Message</label>
    <div class="input-group">
      <textarea name="message" class="form-control" required></textarea>
    </div>
  </div>
  <div class="form-group row">
    <div class="input-group">
      <button type="submit" class="btn btn-primary">Send</button>
    </div>
  </div>
  <div class="text-center">
    <p><small>(Powered by <a rel="nofollow" href="https://un-static.com/">Un-static Forms</a>)</small></p>
  </div>
</form>
